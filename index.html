<title>Keepwright</title>
<style>
:root{
  /* Layout: full-bleed 3D diorama, floating ink HUD — stockpile on top, build tray along the bottom */
  --ink:#141a20; --panel:rgba(20,26,32,.88); --panel2:rgba(40,48,56,.94); --line:rgba(242,236,224,.13);
  --txt:#f2ece0; --dim:#a9b0b4; --blue:#5f92cc; --red:#d3624d; --gold:#e8b64c; --ok:#8cc56f; --bad:#e06a56;
  --wood:#a8784b; --stone:#b3afa6; --food:#e2c24f; --iron:#7f97ad;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
body{background:linear-gradient(#b7d1dd 0%,#d6e4e2 55%,#e4ebdc 100%);color:var(--txt);font:13px/1.3 var(--sans);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 8px) 0 calc(env(safe-area-inset-left,0px) + 8px);display:flex;flex-direction:column;gap:6px;pointer-events:none}
.row{display:flex;gap:6px;align-items:center}
.res{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 6px;font-weight:650;font-variant-numeric:tabular-nums;min-width:0;flex:1 1 0;justify-content:flex-start}
.res b{font-weight:650;font-size:14px}
.ic{width:16px;height:16px;flex:none;display:inline-block}
.ic.w{background:radial-gradient(circle at 50% 50%,#d9b07d 0 22%,#9a6a3e 24% 40%,#c99a66 42% 60%,#7c5330 62%);border-radius:50%}
.ic.s{background:linear-gradient(160deg,#d6d2c9,#9b978e);clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.ic.f{background:radial-gradient(circle at 35% 35%,#f4dc7d,#c99a2c);border-radius:50% 50% 50% 8%}
.ic.i{background:linear-gradient(#a8bccc,#5f7488);clip-path:polygon(15% 25%,85% 25%,100% 80%,0 80%)}
.ic.a{background:linear-gradient(90deg,#8a6a45 0 70%,#d8d4cc 70%);height:4px;margin:6px 0}
.tbtn[aria-pressed=false]{opacity:.5}
#bFx{font-size:11px;letter-spacing:.04em;text-transform:uppercase;height:28px;min-width:0;padding:0 10px;align-self:center}
.tbtn{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;height:32px;min-width:40px;padding:0 10px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
#keeps{gap:8px}
.kb{pointer-events:auto;flex:1 1 0;display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:600 10px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.kb em{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;display:block}
.kb u{display:block;height:100%;width:100%;border-radius:3px;transition:width .3s}
#kbP u{background:var(--blue)} #kbE u{background:var(--red)}
#kbP i,#kbE i{width:8px;height:8px;border-radius:2px;flex:none}
#kbP i{background:var(--blue)} #kbE i{background:var(--red)}

#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 92px);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;font-size:12.5px;max-width:100%;text-align:center;animation:tin .25s ease-out}
.toast.warn{border-color:rgba(224,106,86,.6)}
.toast.good{border-color:rgba(140,197,111,.6)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

#bot{position:fixed;left:0;right:0;bottom:0;padding:0 calc(env(safe-area-inset-right,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 8px) calc(env(safe-area-inset-left,0px) + 8px);display:flex;flex-direction:column;gap:6px;pointer-events:none}
#ctx{pointer-events:auto;align-self:center;width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;box-sizing:border-box}
#ctx h3{margin:0;font:600 17px/1.15 var(--serif);font-variant:small-caps;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
#ctx h3 .tm{width:9px;height:9px;border-radius:2px;flex:none}
#ctx p{margin:0;color:var(--dim);font-size:12.5px;text-wrap:pretty}
#ctx .st{color:var(--txt);font-size:13px;font-variant-numeric:tabular-nums}
.hpbar{height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.hpbar u{display:block;height:100%;background:var(--ok)}
.ups{display:flex;flex-direction:column;gap:6px}
.up{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border-radius:10px;padding:8px 10px;background:rgba(232,182,76,.12);border:1px solid rgba(232,182,76,.45)}
.up[disabled]{opacity:.5;cursor:default}
.up b{font:600 14px/1.1 var(--serif);color:var(--gold)}
.up span{font-size:12px;color:var(--dim)}
#ctx{max-height:46vh;overflow-y:auto;touch-action:pan-y}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{border-radius:10px;padding:9px 14px;font-weight:700;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.btn.pri{background:var(--gold);color:#241a08;border-color:transparent}
.btn.pri[disabled]{opacity:.45}
.btn.danger{background:rgba(224,106,86,.18);border-color:rgba(224,106,86,.5);color:#ffd9d1}
.costs{display:flex;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums;font-weight:650;font-size:12.5px}
.costs span{display:inline-flex;align-items:center;gap:4px}
.costs .short{color:#ffb4a6}

#tray{pointer-events:auto;display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px;align-items:stretch;box-sizing:border-box}
#modes{display:flex;flex-direction:column;gap:4px;flex:none}
.mode{width:58px;flex:1;border-radius:10px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;gap:5px;min-height:28px}
.mode.on{background:var(--txt);color:var(--ink)}
.mode.on.rm{background:var(--bad);color:#fff}
#pal{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;flex:1;min-width:0;touch-action:pan-x;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#pal::-webkit-scrollbar{display:none}
.bb{flex:none;width:70px;border-radius:11px;padding:4px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;background:rgba(255,255,255,.04);border:1px solid transparent}
.bb img{width:52px;height:52px;display:block;pointer-events:none}
.bb .nm{font-size:10.5px;font-weight:650;line-height:1.1;text-align:center;white-space:nowrap}
.bb .cc .ic{width:8px;height:8px;margin-right:1px;vertical-align:-1px}
.bb .cc .ic.a{height:3px}
.bb .cc{font-size:9.5px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.bb.on{background:rgba(232,182,76,.18);border-color:var(--gold)}
.bb.poor .cc{color:#ffb4a6}

#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));background:rgba(20,26,32,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 20px 18px;max-width:400px;width:100%;box-sizing:border-box;max-height:100%;overflow:auto;touch-action:pan-y}
#card h1{margin:0;font:600 40px/1 var(--serif);font-variant:small-caps;letter-spacing:.03em}
#card .sub{margin:6px 0 14px;color:var(--gold);font:italic 15px/1.3 var(--serif)}
#card ul{margin:0 0 14px;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
#card li{display:grid;grid-template-columns:20px 1fr;gap:8px;color:var(--dim);font-size:13px;text-wrap:pretty}
#card li b{color:var(--txt);font-weight:650}
#card li i{width:10px;height:10px;border-radius:2px;margin-top:3px}
#card .ctl{font-size:12px;color:var(--dim);border-top:1px solid var(--line);padding-top:10px;margin-bottom:14px}
#card .btn.pri{width:100%;padding:13px;font-size:15px}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.kb u{transition:none}}
</style>

<canvas id="gl"></canvas>

<div id="top">
  <div class="row">
    <div class="res" title="Wood"><i class="ic w"></i><b id="rw">0</b></div>
    <div class="res" title="Stone"><i class="ic s"></i><b id="rs">0</b></div>
    <div class="res" title="Food"><i class="ic f"></i><b id="rf">0</b></div>
    <div class="res" title="Iron"><i class="ic i"></i><b id="ri">0</b></div>
    <button class="tbtn" id="bSpd" aria-label="Game speed">1×</button>
    <button class="tbtn" id="bPause" aria-label="Pause">❚❚</button>
  </div>
  <div class="row" id="keeps">
    <button class="kb" id="kbP"><i></i>Your keep<em><u></u></em></button>
    <button class="kb" id="kbE"><i></i>Red keep<em><u></u></em></button>
    <button class="tbtn" id="bFx" aria-label="Toggle tilt-shift" aria-pressed="true">Tilt</button>
  </div>
</div>
<div id="toasts"></div>

<div id="bot">
  <div id="ctx" hidden></div>
  <div id="tray">
    <div id="modes">
      <button class="mode on" data-mode="look">Look</button>
      <button class="mode" data-mode="mark">Mark</button>
      <button class="mode rm" data-mode="remove">Raze</button>
    </div>
    <div id="pal"></div>
  </div>
</div>

<div id="ov">
  <div id="card"></div>
</div>

<script>
'use strict';
/* ================= utilities ================= */
const N=48;
const $=s=>document.querySelector(s);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeNoise(r){const g=new Float32Array(4096);for(let i=0;i<4096;i++)g[i]=r();const v=(a,b)=>g[((b&63)<<6)|(a&63)];const s=t=>t*t*(3-2*t);
  return (x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),u=s(x-xi),w=s(y-yi);return(v(xi,yi)*(1-u)+v(xi+1,yi)*u)*(1-w)+(v(xi,yi+1)*(1-u)+v(xi+1,yi+1)*u)*w}}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const mixc=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const shade=(a,f)=>[a[0]*f,a[1]*f,a[2]*f];
const sub3=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const cross3=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const dot3=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const norm3=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]};
const inb=(i,j)=>i>=0&&j>=0&&i<N&&j<N;
const tileAt=(x,z)=>clamp(Math.floor(z),0,N-1)*N+clamp(Math.floor(x),0,N-1);
const RES=['w','s','f','i'];
const RESNAME={w:'wood',s:'stone',f:'food',i:'iron'};

/* ================= palette ================= */
const C={
  grass:[.60,.74,.44],grass2:[.53,.69,.40],grassD:[.47,.61,.36],path:[.80,.72,.55],sand:[.84,.78,.58],bank:[.62,.50,.36],
  water:[.35,.60,.73],ford:[.58,.76,.77],soil:[.50,.39,.29],soilD:[.40,.31,.24],
  rock:[.70,.69,.66],rockD:[.56,.56,.55],iron:[.66,.43,.31],
  leaf:[.36,.58,.33],leaf2:[.47,.66,.34],pine:[.24,.46,.35],pine2:[.29,.53,.38],trunk:[.47,.34,.24],
  wood:[.71,.55,.37],woodD:[.50,.37,.26],stone:[.83,.81,.76],stoneD:[.68,.66,.62],
  straw:[.88,.76,.45],crop:[.84,.75,.35],cropG:[.55,.72,.32],skin:[.94,.79,.64],steel:[.72,.74,.78],
  canvas:[.90,.86,.76],steelD:[.50,.52,.58],horse:[.56,.42,.30],horseD:[.40,.30,.22],dark:[.22,.22,.24],fire:[1,.62,.25],gold:[.95,.75,.30]
};
const TEAM=[{roof:[.34,.52,.74],dk:[.24,.38,.56],css:'var(--blue)'},{roof:[.76,.33,.27],dk:[.55,.23,.19],css:'var(--red)'}];

/* ================= mesh builder ================= */
class MB{
  constructor(){this.p=[];this.n=[];this.c=[]}
  tri(a,b,c,col,ctr){let n=cross3(sub3(b,a),sub3(c,a));const l=Math.hypot(n[0],n[1],n[2]);if(l<1e-10)return;n=[n[0]/l,n[1]/l,n[2]/l];
    if(ctr){const m=[(a[0]+b[0]+c[0])/3-ctr[0],(a[1]+b[1]+c[1])/3-ctr[1],(a[2]+b[2]+c[2])/3-ctr[2]];if(dot3(n,m)<0)n=[-n[0],-n[1],-n[2]];}
    for(const v of[a,b,c]){this.p.push(v[0],v[1],v[2]);this.n.push(n[0],n[1],n[2]);this.c.push(col[0],col[1],col[2]);}}
  quad(a,b,c,d,col,ctr){this.tri(a,b,c,col,ctr);this.tri(a,c,d,col,ctr)}
  box(x0,y0,z0,x1,y1,z1,col,top){const ctr=[(x0+x1)/2,(y0+y1)/2,(z0+z1)/2],t=top||col;
    this.quad([x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1],t,ctr);
    if(y0>.001)this.quad([x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1],col,ctr);
    this.quad([x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1],col,ctr);
    this.quad([x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],col,ctr);
    this.quad([x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0],col,ctr);
    this.quad([x1,y0,z0],[x1,y0,z1],[x1,y1,z1],[x1,y1,z0],col,ctr);}
  roof(x0,z0,x1,z1,y,h,col,ecol){const zm=(z0+z1)/2,ctr=[(x0+x1)/2,y+h*.3,zm];const A=[x0,y,z0],B=[x1,y,z0],Cc=[x1,y,z1],D=[x0,y,z1],r0=[x0,y+h,zm],r1=[x1,y+h,zm];
    this.quad(A,B,r1,r0,col,ctr);this.quad(D,Cc,r1,r0,col,ctr);this.tri(A,D,r0,ecol||col,ctr);this.tri(B,Cc,r1,ecol||col,ctr);}
  roofZ(x0,z0,x1,z1,y,h,col,ecol){const xm=(x0+x1)/2,ctr=[xm,y+h*.3,(z0+z1)/2];const A=[x0,y,z0],B=[x0,y,z1],Cc=[x1,y,z1],D=[x1,y,z0],r0=[xm,y+h,z0],r1=[xm,y+h,z1];
    this.quad(A,B,r1,r0,col,ctr);this.quad(D,Cc,r1,r0,col,ctr);this.tri(A,D,r0,ecol||col,ctr);this.tri(B,Cc,r1,ecol||col,ctr);}
  cyl(cx,y0,cz,r0,y1,r1,n,col,rot,cap){rot=rot||0;const ctr=[cx,(y0+y1)/2,cz];
    for(let i=0;i<n;i++){const a0=rot+i/n*6.28318,a1=rot+(i+1)/n*6.28318;
      const p0=[cx+Math.cos(a0)*r0,y0,cz+Math.sin(a0)*r0],p1=[cx+Math.cos(a1)*r0,y0,cz+Math.sin(a1)*r0];
      if(r1>0){const q0=[cx+Math.cos(a0)*r1,y1,cz+Math.sin(a0)*r1],q1=[cx+Math.cos(a1)*r1,y1,cz+Math.sin(a1)*r1];
        this.quad(p0,p1,q1,q0,col,ctr);this.tri([cx,y1,cz],q0,q1,cap||col,[cx,y0-1,cz]);}
      else this.tri(p0,p1,[cx,y1,cz],col,ctr);
      if(y0>.01&&r0>0)this.tri([cx,y0,cz],p1,p0,col,[cx,y0+1,cz]);}}
  blob(cx,cy,cz,rx,ry,rz,col,jit,rnd,seg,rings,colf){seg=seg||6;rings=rings||4;rnd=rnd||Math.random;const V=[];
    for(let a=0;a<=rings;a++){const ph=a/rings*Math.PI;for(let b=0;b<seg;b++){const th=b/seg*6.28318+(a%2)*Math.PI/seg;const jj=(a===0||a===rings)?1:1+(rnd()-.5)*jit;
      V.push([cx+Math.sin(ph)*Math.cos(th)*rx*jj,cy+Math.cos(ph)*ry*jj,cz+Math.sin(ph)*Math.sin(th)*rz*jj]);}}
    const ctr=[cx,cy,cz];
    for(let a=0;a<rings;a++)for(let b=0;b<seg;b++){const p00=V[a*seg+b],p01=V[a*seg+(b+1)%seg],p10=V[(a+1)*seg+b],p11=V[(a+1)*seg+(b+1)%seg];
      const c=colf?colf(a,b):col;this.tri(p00,p10,p11,c,ctr);this.tri(p00,p11,p01,c,ctr);}}
  disc(cx,y,cz,r,n,col){for(let i=0;i<n;i++){const a0=i/n*6.28318,a1=(i+1)/n*6.28318;
    this.tri([cx,y,cz],[cx+Math.cos(a0)*r,y,cz+Math.sin(a0)*r],[cx+Math.cos(a1)*r,y,cz+Math.sin(a1)*r],col,[cx,y-1,cz]);}}
}

/* ================= WebGL ================= */
const cv=$('#gl');
const gl=cv.getContext('webgl',{antialias:true,alpha:true,premultipliedAlpha:false});
const VS=`attribute vec3 aP;attribute vec3 aN;attribute vec3 aC;
uniform mat4 uVP;uniform mat4 uM;uniform vec3 uSun;uniform vec4 uTint;uniform vec2 uFogR;
varying vec3 vC;varying float vF;
void main(){vec4 w=uM*vec4(aP,1.);gl_Position=uVP*w;vec3 n=normalize((uM*vec4(aN,0.)).xyz);
float d=max(dot(n,uSun),0.);float h=n.y*.5+.5;
vec3 amb=mix(vec3(.36,.35,.40),vec3(.62,.67,.74),h);
vec3 c=mix(aC,uTint.rgb,uTint.a);
vC=c*(amb+vec3(1.,.93,.80)*d*.62);
vF=smoothstep(uFogR.x,uFogR.y,gl_Position.w);}`;
const FS=`precision mediump float;uniform vec3 uFog;uniform float uA;varying vec3 vC;varying float vF;
void main(){gl_FragColor=vec4(mix(vC,uFog,vF),uA);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o}
const prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);gl.useProgram(prog);
const L={};['uVP','uM','uSun','uTint','uFogR','uFog','uA'].forEach(n=>L[n]=gl.getUniformLocation(prog,n));
const aP=gl.getAttribLocation(prog,'aP'),aN=gl.getAttribLocation(prog,'aN'),aC=gl.getAttribLocation(prog,'aC');
gl.enableVertexAttribArray(aP);gl.enableVertexAttribArray(aN);gl.enableVertexAttribArray(aC);
gl.enable(gl.DEPTH_TEST);
gl.blendFuncSeparate(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA,gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
const sun=norm3([-.55,.78,.38]);gl.uniform3f(L.uSun,sun[0],sun[1],sun[2]);
gl.uniform3f(L.uFog,.82,.88,.88);

function makeMesh(m){const mk=a=>{const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(a),gl.STATIC_DRAW);return b};
  return{bp:mk(m.p),bn:mk(m.n),bc:mk(m.c),count:m.p.length/3,pts:m.p}}
function freeMesh(me){if(!me)return;gl.deleteBuffer(me.bp);gl.deleteBuffer(me.bn);gl.deleteBuffer(me.bc)}
const MM=new Float32Array(16);let lastMesh=null;

    for(let d=0;d<8;d++){const ni=i+DIRS[d][0],nj=j+DIRS[d][1];if(!inb(ni,nj))continue;const nk=nj*N+ni;if(clsA[nk]===stp)continue;

/* ================= entities ================= */
function canPlace(type,i,j,spacing){const s=B[type].s;
  for(let y=j;y<j+s;y++)for(let x=i;x<i+s;x++){if(!inb(x,y))return false;const k=y*N+x;if(res[k]||fld[k]||yardT[k])return false;if(occ[k]){const ob=bmap.get(occ[k]);if(!(type==='gate'&&ob&&ob.team===0&&ob.type==='wall'&&ob.built))return false;}const t=terr[k];if(t===1)return false;if(t===2&&!FORDOK[type])return false;}
  if(spacing)for(let y=j-1;y<=j+s;y++)for(let x=i-1;x<=i+s;x++){if(!inb(x,y))return false;if(occ[y*N+x])return false;}
  return true;}
function canField(i,j){if(!inb(i,j))return false;const k=j*N+i;return terr[k]===0&&!res[k]&&!occ[k]&&!fld[k]&&!yardT[k];}
function setField(i,j,team){const k=j*N+i;fld[k]=1;fldOw[k]=team+1;fldTm[k]=0;}
function placeB(team,type,i,j,built){const d=B[type];
  const b={id:bid++,team,type,i,j,s:d.s,maxHp:d.hp,hp:built?d.hp:d.hp*.3,built,prog:built?1:0,
    need:Object.assign({w:0,s:0,f:0,i:0},d.cost),have:{w:0,s:0,f:0,i:0},inc:{w:0,s:0,f:0,i:0},
    workers:[],spawnT:1.5,t:Math.random()*3,cd:0,arrows:ARROWB[type]?6:0,incA:0,sg:{ar:0,bw:0,sw:0,sp:0},gs:{sw:0,bw:0,sp:0},gi:{sw:0,bw:0,sp:0},off:null,yard:null,yt:null,hitT:0,dead:false,node:TREE[type]||null,depth:0,charges:4};
  for(let y=j;y<j+b.s;y++)for(let x=i;x<i+b.s;x++)occ[y*N+x]=b.id;
  blds.push(b);bmap.set(b.id,b);if(type==='keep')teams[team].keep=b;

// the courtyard: a paved 3x3 plot beside the hall, reserved so nothing else is built on it
function makeYard(b){const ek=teams[1-b.team]&&teams[1-b.team].keep;const ex=ek?cx(ek):N/2,ez=ek?cz(ek):N/2,ox=cx(b),oz=cz(b);let best=null,bs=-1e9;
  for(let a=0;a<16;a++){const ang=a/16*6.283,r=b.s/2+1.9,yx=Math.floor(ox+Math.cos(ang)*r)+.5,yz=Math.floor(oz+Math.sin(ang)*r)+.5;let ok=0;
    for(let dz=-1;dz<=1;dz++)for(let dx=-1;dx<=1;dx++){const x=Math.floor(yx)+dx,z=Math.floor(yz)+dz;if(!inb(x,z)){ok-=3;continue;}const k=z*N+x;if(terr[k]===0&&!res[k]&&!occ[k]&&!fld[k]&&!yardT[k])ok++;else ok-=2;}
    const dl=Math.hypot(ex-ox,ez-oz)||1,sc=ok*3+((ex-ox)*(yx-ox)+(ez-oz)*(yz-oz))/dl*.4;if(sc>bs){bs=sc;best=[yx,yz];}}
  b.yard=best;b.yt=[];
  for(let dz=-1;dz<=1;dz++)for(let dx=-1;dx<=1;dx++){const x=Math.floor(best[0])+dx,z=Math.floor(best[1])+dz;if(!inb(x,z))continue;const k=z*N+x;if(terr[k]===0&&!res[k]&&!occ[k]&&!fld[k]&&!yardT[k]){yardT[k]=b.id;b.yt.push(k);}}}
function complete(b){b.built=true;b.prog=1;b.hp=b.maxHp;b.spawnT=1;
  if(b.team===0)toast(B[b.type].n+' complete','done'+b.type,b.type==='wall'?20:0,'good');}
function destroyB(b,quiet){if(b.dead)return;b.dead=true;
  for(let y=b.j;y<b.j+b.s;y++)for(let x=b.i;x<b.i+b.s;x++)if(occ[y*N+x]===b.id)occ[y*N+x]=0;
  if(b.yt)for(const k of b.yt)if(yardT[k]===b.id)yardT[k]=0;
  blds.splice(blds.indexOf(b),1);bmap.delete(b.id);
  for(const w of b.workers.slice())kill(w,true);
  if(!quiet){for(let n=0;n<6;n++)fx.push({x:cx(b)+(Math.random()-.5)*b.s,y:.3+Math.random()*.6,z:cz(b)+(Math.random()-.5)*b.s,t:0,d:.7+Math.random()*.4,sz:.35*b.s,col:[.55,.52,.5]});}
  if(sel===b)select(null);if(rmTarget===b){rmTarget=null;}
  if(b.type==='keep')endGame(b.team===0?'lose':'win');
  else if(!quiet){
    // a razed-by-enemy building is replanned on the spot; supplies already delivered are half lost
    if(!b.built)for(const r of RES)teams[b.team].stock[r]+=Math.floor(b.have[r]/2);
    const nb=placeB(b.team,b.type,b.i,b.j,false);nb.node=b.node;nb.depth=b.depth;
    if(b.team===0&&!WALLISH[b.type])toast('Your '+B[b.type].n+' was destroyed. A replacement is planned.','lost'+b.type,6,'warn');}
}
function freeAdj(b,team){let best=null,bd=1e9;const fx_=cx(b),fz=cz(b)+b.s;
  for(let y=b.j-1;y<=b.j+b.s;y++)for(let x=b.i-1;x<=b.i+b.s;x++){if(!inb(x,y))continue;if(x>=b.i&&x<b.i+b.s&&y>=b.j&&y<b.j+b.s)continue;
    if(!tcost(team,y*N+x,false))continue;const d=Math.hypot(x+.5-fx_,y+.5-fz)+Math.random()*.5;if(d<bd){bd=d;best=[x,y];}}

function findCmd(team,x,z,fn){let best=null,bd=60;for(const c of units){if(c.dead||c.team!==team||!U[c.kind].cmd||c.st!=='cwait')continue;if(fn&&!fn(c))continue;const d=Math.hypot(c.x-x,c.z-z);if(d<bd){bd=d;best=c;}}return best;}
function spawnU(b,kind){const p=freeAdj(b,b.team);if(!p)return null;const d=U[kind];
  const u={id:uid++,team:b.team,kind,x:p[0]+.5,z:p[1]+.5,hp:d.hp,mhp:d.hp,home:b,st:'idle',t:.3,path:null,pi:0,goal:null,repT:0,fails:0,cd:0,
    face:0,anim:Math.random()*9,carry:null,tgt:null,tb:null,scan:0,bscan:0,rep:0,job:null,tk:-1,moving:false,working:false,hitT:0,dead:false,lead:null,fol:[],pat:0,rp:null,cdT:0};

      let rx=p[0],rz=p[1];if(b.yard){const yx=Math.floor(b.yard[0]),yz=Math.floor(b.yard[1]);if(tcost(b.team,yz*N+yx,false)){rx=yx;rz=yz;}}u.rp=[rx,rz];}
    else{u.st='march';const c=findCmd(b.team,u.x,u.z,c=>c.fol.length<c.cap&&(!c.take||c.take.includes(kind)));if(c){u.lead=c;c.fol.push(u);}}}

function kill(u,quiet){if(u.dead)return;u.dead=true;relClaim(u);
  if(u.job){if(u.job.res)u.job.site.inc[u.job.r]-=u.job.amt;if(u.job.t&&!u.job.t.dead){if(u.job.g==='ar')u.job.t.incA-=u.job.amt;else if(u.job.g)u.job.t.gi[u.job.g]-=u.job.amt;}u.job=null;}
  if(u.home&&!U[u.kind].tr&&!U[u.kind].siege){const w=u.home.workers,ix=w.indexOf(u);if(ix>=0)w.splice(ix,1);}
  if(u.lead){const ix=u.lead.fol.indexOf(u);if(ix>=0)u.lead.fol.splice(ix,1);}
  if(!quiet){fx.push({x:u.x,y:.25,z:u.z,t:0,d:.5,sz:.25,col:[.85,.83,.8]});
    if(u.team===0&&!U[u.kind].fight&&!U[u.kind].siege)toast('Enemies killed one of your '+U[u.kind].n.toLowerCase()+'s','wk',14,'warn');}
}
function relClaim(u){if(u.tk>=0){claim[u.tk]=Math.max(0,claim[u.tk]-1);u.tk=-1;}}
function hurt(t,dmg,src){if(t.dead)return;t.hp-=dmg;t.hitT=.15;
  if(src&&!src.dead&&U[t.kind].fight&&(!t.tgt||t.tgt.dead))t.tgt=src;
  if(t.hp<=0)kill(t);}
function hurtB(b,dmg){if(b.dead||eth(b))return;b.hp-=dmg;b.hitT=.12;
  if(b.team===0){if(b.type==='keep')toast('Your keep is under attack!','katk',10,'warn');else toast('Enemies are breaking your '+B[b.type].n.toLowerCase(),'batk',12,'warn');}
  if(b.hp<=0)destroyB(b);}
function shoot(x,y,z,t,dmg,team,src,sc){const d=Math.hypot(t.x-x,t.z-z);arrows.push({x0:x,y0:y,z0:z,ex:t.x,ez:t.z,t:t,dmg,team,src,sc:sc||1,tt:0,dur:Math.max(.18,d/13),arc:Math.min(1.2,d*.12)});}
function nearestEnemyUnit(team,x,z,r,filt){let best=null,bd=r;for(const u of units){if(u.dead||u.team===team)continue;if(filt&&!filt(u))continue;const d=Math.hypot(u.x-x,u.z-z);if(d<=bd){bd=d;best=u;}}return best;}

/* ================= movement ================= */
function goal(u,x0,z0,x1,z1,brk){u.goal=[x0,z0,x1,z1,!!brk];u.path=null;u.repT=0;}
function goalB(u,b,brk){goal(u,b.i,b.j,b.i+b.s-1,b.j+b.s-1,brk);}
function stepTo(u,tx,tz,dt){const dx=tx-u.x,dz=tz-u.z,d=Math.hypot(dx,dz);const sp=U[u.kind].sp*(terr[tileAt(u.x,u.z)]===2?.6:1)*dt;
  u.moving=true;if(d>1e-4)u.face=Math.atan2(dx,dz);if(d<=sp){u.x=tx;u.z=tz;return true;}u.x+=dx/d*sp;u.z+=dz/d*sp;return false;}
function moveAlong(u,dt){if(!u.path||u.pi>=u.path.length)return true;
  const k=u.path[u.pi],o=occ[k];
  if(o){const b=bmap.get(o);if(b&&b.type!=='trap'&&!eth(b)){if(b.team!==u.team){if(U[u.kind].fight||U[u.kind].siege){u.tb=b;u.goal=null;}u.path=null;return false;}if(b.type!=='gate'){u.path=null;return false;}}}
  if(terr[k]===1||res[k]){u.path=null;return false;}
  if(stepTo(u,k%N+.5,((k/N)|0)+.5,dt)){u.pi++;return u.pi>=u.path.length;}return false;}
function walk(u,dt){
  if(!u.path){if(!u.goal)return 1;if(u.repT>0){u.repT-=dt;return 0;}
    const g=u.goal,p=findPath(u.team,u.x,u.z,g[0],g[1],g[2],g[3],g[4]);if(!p){u.repT=1.2;u.fails++;return -1;}u.path=p;u.pi=0;}
  if(moveAlong(u,dt)){u.path=null;u.goal=null;u.fails=0;return 1;}return 0;}
function chase(u,t,dt){const d=Math.hypot(t.x-u.x,t.z-u.z);
  if(d<2.2&&d>.01){const nx=u.x+(t.x-u.x)/d*.35,nz=u.z+(t.z-u.z)/d*.35;if(tcost(u.team,tileAt(nx,nz),false)){u.path=null;u.goal=null;stepTo(u,t.x,t.z,dt);return;}}
  u.rep-=dt;if(u.rep<=0||(!u.path&&!u.goal)){u.rep=.7;const ti=Math.floor(t.x),tj=Math.floor(t.z);goal(u,ti,tj,ti,tj,false);}
  walk(u,dt);}
function wander(u,x,z,r){const tx=clamp(Math.floor(x+(Math.random()-.5)*2*r),0,N-1),tz=clamp(Math.floor(z+(Math.random()-.5)*2*r),0,N-1);goal(u,tx,tz,tx,tz,false);}

/* ================= unit brains ================= */
function pickBuildJob(u){const T=teams[u.team];let best=null,bs=1e9;
  for(const s of blds){if(s.team!==u.team||s.built)continue;const bk=BUILDER[s.type];if(bk&&bk!=='any'&&bk!==u.kind)continue;const d=Math.hypot(cx(s)-u.x,cz(s)-u.z);let full=true,haul=null;
    for(const r of RES){if(s.need[r]>s.have[r])full=false;const rem=s.need[r]-s.have[r]-s.inc[r];if(!haul&&rem>0&&T.stock[r]>=1)haul={kind:'haul',site:s,r,amt:Math.min(10,rem,Math.floor(T.stock[r]))};}
    if(full){const sc=d*.3+s.id*.5-1000;if(sc<bs){bs=sc;best={kind:'build',site:s};}}
    else if(haul){const sc=d*.3+s.id*.5;if(sc<bs){bs=sc;best=haul;}}}
  return best;}
function goHome(u){if(u.home&&!u.home.dead&&distRect(u.x,u.z,u.home)>2.2&&!u.goal){goalB(u,u.home);u.st='home';}}
function thinkBuilder(u,dt){const T=teams[u.team],j=u.job;
  switch(u.st){
  case 'idle':{u.t-=dt;if(u.t>0)return;u.t=.6;const job=pickBuildJob(u);
    if(job){u.job=job;if(job.kind==='haul'){job.site.inc[job.r]+=job.amt;job.res=true;goalB(u,T.keep);u.st='toKeep';}else{goalB(u,job.site);u.st='toBuild';}}
    else goHome(u);return;}
  case 'home':if(walk(u,dt)!==0){u.st='idle';u.goal=null;}return;
  case 'toKeep':{if(dead(j.site)){j.site.inc[j.r]-=j.amt;u.job=null;u.st='idle';return;}
    const r=walk(u,dt);if(r===-1&&u.fails>3){j.site.inc[j.r]-=j.amt;u.job=null;u.st='idle';u.goal=null;return;}
    if(r===1){const take=Math.min(j.amt,Math.floor(T.stock[j.r]));j.site.inc[j.r]-=j.amt;j.res=false;
      if(take<=0){u.job=null;u.st='idle';return;}
      T.stock[j.r]-=take;j.amt=take;j.site.inc[j.r]+=take;j.res=true;u.carry={r:j.r,amt:take};goalB(u,j.site);u.st='toSite';}
    return;}
  case 'toSite':{if(dead(j.site)||j.site.built){T.stock[j.r]+=j.amt;if(!dead(j.site))j.site.inc[j.r]-=j.amt;u.carry=null;u.job=null;u.st='idle';u.goal=null;return;}
    const r=walk(u,dt);if(r===-1&&u.fails>3){T.stock[j.r]+=j.amt;j.site.inc[j.r]-=j.amt;u.carry=null;u.job=null;u.st='idle';u.goal=null;return;}
    if(r===1){j.site.have[j.r]+=j.amt;j.site.inc[j.r]-=j.amt;j.res=false;u.carry=null;u.job=null;u.st='idle';u.t=.05;}
    return;}
  case 'toBuild':{if(dead(j.site)||j.site.built){u.job=null;u.st='idle';u.goal=null;return;}
    const r=walk(u,dt);if(r===-1&&u.fails>3){u.job=null;u.st='idle';u.goal=null;return;}if(r===1)u.st='building';return;}
  case 'building':{const s=j.site;if(dead(s)||s.built){u.job=null;u.st='idle';return;}

    u.face=Math.atan2(cx(s)-u.x,cz(s)-u.z);u.working=true;

  }}
function findRes(u,rt,cap){const T=teams[u.team],h=u.home,hx=cx(h),hz=cz(h);
  let useM=false;if(!T.ai)for(let k=0;k<N*N;k++)if(mark[k]&&res[k]===rt){useM=true;break;}
  let best=-1,bd=1e9;const nr=noReach[u.team];
  for(let k=0;k<N*N;k++){if(res[k]!==rt||claim[k]>=cap||nr[k]>gameT)continue;if(useM&&!mark[k])continue;
    const d=Math.hypot(k%N+.5-hx,((k/N)|0)+.5-hz);if(!useM&&d>11)continue;const sc=d+Math.hypot(k%N+.5-u.x,((k/N)|0)+.5-u.z)*.3;if(sc<bd){bd=sc;best=k;}}
  return best;}
function thinkGather(u,dt,rt,key,yld,gt,cap){const T=teams[u.team];
  switch(u.st){
  case 'idle':{u.t-=dt;if(u.t>0)return;u.t=1;const k=findRes(u,rt,cap);
    if(k<0){goHome(u);return;}u.tk=k;claim[k]++;goal(u,k%N,(k/N)|0,k%N,(k/N)|0);u.st='toRes';return;}
  case 'home':if(walk(u,dt)!==0){u.st='idle';u.goal=null;}return;
  case 'toRes':{if(res[u.tk]!==rt){relClaim(u);u.st='idle';u.goal=null;return;}
    const r=walk(u,dt);if(r===-1&&u.fails>2){noReach[u.team][u.tk]=gameT+30;relClaim(u);u.st='idle';u.goal=null;u.fails=0;return;}
    if(r===1){u.st='work';u.t=gt;}return;}
  case 'work':{if(res[u.tk]!==rt){relClaim(u);u.st='idle';return;}
    u.face=Math.atan2(u.tk%N+.5-u.x,((u.tk/N)|0)+.5-u.z);u.working=true;u.t-=dt;
    if(u.t<=0){const k=u.tk;amt[k]--;if(amt[k]<=0){res[k]=0;mark[k]=0;}terrDirty=true;relClaim(u);u.carry={r:key,amt:yld};goalB(u,u.home);u.st='toHome';}return;}
  case 'toHome':{const r=walk(u,dt);if(r===-1&&u.fails>3){u.carry=null;u.st='idle';u.goal=null;return;}
    if(r===1){T.stock[key]+=u.carry.amt;u.carry=null;u.st='idle';u.t=.2;}return;}
  }}
function demandOf(b,g){if(!b.built)return 0;
  if(g==='ar'){const A=ARROWB[b.type];return A?A.max-b.arrows-b.incA:0;}
  if(!b.node||!TRAIN[b.type]||NEED[b.node.prod]!==g)return 0;return GMAX-b.gs[g]-b.gi[g];}
function thinkRunner(u,dt){const h=u.home;
  switch(u.st){
  case 'idle':{u.t-=dt;if(u.t>0)return;u.t=1;
    let best=null,bs=1e9,bg=null,ba=0;
    for(const sp of SUPPLY[h.type]||[]){const have=h.sg[sp.g],minA=sp.g==='ar'?5:1;if(have<minA)continue;
      for(const b of blds){if(b.team!==u.team)continue;const amt=Math.min(have,demandOf(b,sp.g),sp.n);if(amt<minA)continue;
        const sc=Math.hypot(cx(b)-u.x,cz(b)-u.z)+(sp.g==='ar'?(b.arrows+b.incA)*.6:0)-amt;if(sc<bs){bs=sc;best=b;bg=sp.g;ba=amt;}}}
    if(best){h.sg[bg]-=ba;if(bg==='ar')best.incA+=ba;else best.gi[bg]+=ba;u.job={t:best,g:bg,amt:ba};u.carry={r:bg,amt:ba};goalB(u,best);u.st='go';return;}
    goHome(u);return;}
  case 'home':if(walk(u,dt)!==0){u.st='idle';u.goal=null;}return;
  case 'go':{const t=u.job.t,g=u.job.g,a=u.job.amt;
    if(dead(t)){if(!h.dead)h.sg[g]+=a;u.carry=null;u.job=null;u.st='idle';u.goal=null;return;}
    const r=walk(u,dt);if(r===-1&&u.fails>3){if(g==='ar')t.incA-=a;else t.gi[g]-=a;if(!h.dead)h.sg[g]+=a;u.carry=null;u.job=null;u.st='idle';u.goal=null;return;}
    if(r===1){if(g==='ar'){t.arrows+=a;t.incA-=a;}else{t.gs[g]+=a;t.gi[g]-=a;}u.carry=null;u.job=null;u.st='idle';u.t=.2;}return;}
  }}
// engineers raise traps and ballistae when there are plans, and otherwise carry parts
function thinkEngineer(u,dt){
  if(u.st==='go'){thinkRunner(u,dt);return;}
  if(u.st==='idle'){u.t-=dt;if(u.t>0)return;u.t=.6;
    if(pickBuildJob(u)){u.t=0;thinkBuilder(u,0);return;}
    u.t=0;thinkRunner(u,0);return;}
  thinkBuilder(u,dt);}

function scan(u,r,filt){if(u.tgt&&u.tgt.dead)u.tgt=null;if(u.scan>0)return;u.scan=.35;if(!u.tgt)u.tgt=nearestEnemyUnit(u.team,u.x,u.z,r,filt);}
function attackUnit(u,t){const d=U[u.kind];u.face=Math.atan2(t.x-u.x,t.z-u.z);u.working=true;u.path=null;u.goal=null;

function fightTarget(u,dt,leash){const t=u.tgt;const d=Math.hypot(t.x-u.x,t.z-u.z);

function nearestEnemyB(u,r){let best=null,bd=r;for(const b of blds){if(b.team===u.team||b.type==='wall'||eth(b))continue;const d=distRect(u.x,u.z,b);if(d<=bd){bd=d;best=b;}}return best;}
function leaderMarching(L){return L.st==='cmarch'||(!!L.lead&&!L.lead.dead&&leaderMarching(L.lead));}

function sendCmd(c){c.st='cmarch';c.tgt=null;c.path=null;c.goal=null;const n=troopCount(c);
  if(c.team===0)toast('Your '+U[c.kind].n.toLowerCase()+' marches with '+n+' troops','pwave',2,'good');

function bldAttack(u,dt,rng,dmg){const tb=u.tb;

function nearestEnemyBld(u,r){let best=null,bs=1e9;for(const b of blds){if(b.team===u.team||WALLISH[b.type]||b.type==='trap'||eth(b))continue;const d=distRect(u.x,u.z,b);if(d>r)continue;const sc=d-(ARROWB[b.type]?2:0);if(sc<bs){bs=sc;best=b;}}return best;}

/* ================= buildings tick ================= */
function updB(b,dt){if(b.hitT>0)b.hitT-=dt;if(!b.built)return;const T=teams[b.team];
  switch(b.type){
  case 'keep':b.t+=dt;if(b.t>=5){b.t=0;T.stock.f+=1;}
    b.cd-=dt;if(b.cd<=0){const e=nearestEnemyUnit(b.team,cx(b),cz(b),5.5);if(e){shoot(cx(b),2.8,cz(b),e,6,b.team,null);b.cd=1.3;}}break;
  case 'tower':case 'ballista':case 'bastion':{const A=ARROWB[b.type];b.cd-=dt;
    if(b.cd<=0&&b.arrows>=A.use){const e=nearestEnemyUnit(b.team,cx(b),cz(b),A.rng);if(e){shoot(cx(b),A.h,cz(b),e,A.dmg,b.team,null,b.type==='ballista'?1.8:1);b.arrows-=A.use;b.cd=A.cd;
      if(b.arrows<A.use&&b.team===0)toast('A '+B[b.type].n.toLowerCase()+' is out of arrows. A Fletcher keeps them stocked.','noarr',25,'warn');}}break;}
  case 'trap':{b.cd-=dt;if(b.cd<=0){const e=nearestEnemyUnit(b.team,cx(b),cz(b),.6,u=>!U[u.kind].siege);
    if(e){hurt(e,38,null);b.charges--;b.cd=1.2;fx.push({x:cx(b),y:.2,z:cz(b),t:0,d:.4,sz:.3,col:[.6,.45,.3]});if(b.charges<=0)destroyB(b,true);}}break;}
  case 'fletch':case 'smith':case 'engineer':{b.t+=dt;if(b.t>=6.5){b.t=0;let bg=null,bf=2;
      for(const sp of SUPPLY[b.type]){if(b.sg[sp.g]+sp.n>sp.max||!afford(T,sp.c))continue;const f=b.sg[sp.g]/sp.max;if(f<bf){bf=f;bg=sp;}}
      if(bg){pay(T,bg.c);b.sg[bg.g]+=bg.n;}}break;}
  }
  if(b.node&&TRAIN[b.type]){const k=b.node.prod,tp=TROOP[k],g=NEED[k],gn=NEEDN[k]||1;
    // the next officer is only trained once the last one has marched out with an army
    if(b.type==='hall'&&b.off&&!b.off.dead&&b.off.st!=='cmarch'){}
    else{b.t+=dt;

}

/* ================= enemy AI ================= */
const PLAN=['mill','farm','quarry','farm','raider','mine','smith','barracks','fletch','tower','farm','ranger','tower','hall','engineer','barracks','mill','farm','tower','workshop','raider','ballista','barracks','bastion','tower'];
const LOOP=['farm','tower','barracks','ballista','quarry','mine','tower','smith'];
function countRes(x,z,r,t){let n=0;for(let j=Math.floor(z-r);j<=z+r;j++)for(let i=Math.floor(x-r);i<=x+r;i++)if(inb(i,j)&&res[j*N+i]===t)n++;return n;}
function findSpot(team,type){const k=teams[team].keep,ek=teams[1-team].keep;const kx=cx(k),kz=cz(k),s=B[type].s;let best=null,bs=-1e9;
  for(let t=0;t<500;t++){const ang=Math.random()*6.283,r=3+Math.random()*11;const i=Math.floor(kx+Math.cos(ang)*r-s/2+.5),j=Math.floor(kz+Math.sin(ang)*r-s/2+.5);
    if(!canPlace(type,i,j,true))continue;const px=i+s/2,pz=j+s/2;let sc=-Math.hypot(px-kx,pz-kz)*.5+Math.random();
    if(type==='mill')sc+=countRes(px,pz,5,1)*1.2;if(type==='quarry')sc+=countRes(px,pz,5,2)*2;if(type==='mine')sc+=countRes(px,pz,5,3)*2.5;
    if(type==='tower'||type==='barracks'||type==='ranger'||type==='ballista'||type==='bastion'||type==='hall'||type==='workshop'){const ex=cx(ek),ez=cz(ek),dl=Math.hypot(ex-kx,ez-kz);sc+=((ex-kx)*(px-kx)+(ez-kz)*(pz-kz))/dl*1.1;}
    if(sc>bs){bs=sc;best=[i,j];}}
  return best;}
function aiFields(){const T=teams[1];
  for(const b of blds){if(b.team!==1||b.type!=='farm'||!b.built)continue;let n=0;const bx=cx(b),bz=cz(b);
    for(let j=Math.floor(bz-5);j<=bz+5;j++)for(let i=Math.floor(bx-5);i<=bx+5;i++)if(inb(i,j)&&fld[j*N+i]&&fldOw[j*N+i]===2)n++;
    for(let t=0;t<12&&n<7&&T.stock.w>=2;t++){const i=Math.floor(bx+(Math.random()-.5)*8),j=Math.floor(bz+(Math.random()-.5)*8);

function aiUpgrades(){const T=teams[1];for(const b of blds){if(b.team!==1||!b.built||!b.node||!b.node.opts.length||gameT<130*(b.depth+1))continue;
  const o=b.node.opts[Math.random()*b.node.opts.length|0];if(afford(T,o.cost)){pay(T,o.cost);upgradeB(b,o);}}}
function aiTick(dt){const T=teams[1];T.trick+=dt;if(T.trick>=1){T.trick-=1;T.stock.w+=.45;T.stock.s+=.3;T.stock.f+=.35;T.stock.i+=.16;}
  T.aiT-=dt;if(T.aiT>0)return;T.aiT=4;aiFields();aiUpgrades();
  if(blds.filter(b=>b.team===1&&!b.built).length>=2)return;
  const type=T.plan<PLAN.length?PLAN[T.plan]:LOOP[(T.plan-PLAN.length)%LOOP.length];
  if(!afford(T,B[type].cost))return;const p=findSpot(1,type);T.plan++;if(p)placeB(1,type,p[0],p[1],false);}

/* ================= sim ================= */
function tick(dt){gameT+=dt;
  for(const b of blds.slice())if(!b.dead)updB(b,dt);
  for(const u of units)if(!u.dead)updUnit(u,dt);
  // separation: soldiers keep formation spacing, workers only nudge apart
  for(let a=0;a<units.length;a++){const p=units[a];if(p.dead)continue;const pm=U[p.kind].fight||U[p.kind].siege;
    for(let b=a+1;b<units.length;b++){const q=units[b];if(q.dead)continue;const qm=U[q.kind].fight||U[q.kind].siege;
      const mil=pm&&qm;if(!mil&&p.moving&&q.moving)continue;
      const R=mil?(p.team===q.team?(U[p.kind].siege||U[q.kind].siege?.75:.5):.38):.3;
      let dx=q.x-p.x,dz=q.z-p.z,d2=dx*dx+dz*dz;if(d2>=R*R)continue;
      if(d2<1e-6){const an=Math.random()*6.283;dx=Math.cos(an)*.01;dz=Math.sin(an)*.01;d2=dx*dx+dz*dz;}
      const d=Math.sqrt(d2),push=(R-d)*.4;const ux=dx/d*push,uz=dz/d*push;
      if(tcost(p.team,tileAt(p.x-ux,p.z-uz),false)){p.x-=ux;p.z-=uz;}if(tcost(q.team,tileAt(q.x+ux,q.z+uz),false)){q.x+=ux;q.z+=uz;}}}
  for(const a of arrows){if(!a.t.dead){a.ex=a.t.x;a.ez=a.t.z;}a.tt+=dt/a.dur;if(a.tt>=1){a.done=true;if(a.t.bld){const tb=a.t.bld;if(!tb.dead){hurtB(tb,a.dmg);for(const e of units)if(!e.dead&&e.team!==a.team&&Math.hypot(e.x-a.ex,e.z-a.ez)<1.4)hurt(e,a.dmg*.5,null);fx.push({x:a.ex,y:.4,z:a.ez,t:0,d:.5,sz:.45,col:[.6,.55,.5]});}}else if(!a.t.dead)hurt(a.t,a.dmg,a.src);}}
  arrows=arrows.filter(a=>!a.done);units=units.filter(u=>!u.dead);
  for(const f of fx)f.t+=dt;fx=fx.filter(f=>f.t<f.d);
  for(let k=0;k<N*N;k++)if(fld[k]===2){fldTm[k]+=dt;if(fldTm[k]>=GROW)fld[k]=3;}
  nearT-=dt;if(nearT<=0){nearT=2;const k=teams[0].keep;if(k)for(const u of units)if(u.team===1&&(U[u.kind].tr||U[u.kind].siege)&&Math.hypot(u.x-cx(k),u.z-cz(k))<11){toast('Red troops are closing on your keep','near',20,'warn');break;}}
  aiTick(dt);
}

/* ================= camera ================= */
const FOV=.72,FWD=[Math.SQRT1_2,0,-Math.SQRT1_2];
const cam={tx:0,tz:0,D:17,pitch:.94};
function camEye(){const c=Math.cos(cam.pitch),s=Math.sin(cam.pitch);return[cam.tx-FWD[0]*cam.D*c,cam.D*s,cam.tz-FWD[2]*cam.D*c]}
function pick(px,py){const W=innerWidth,H=innerHeight;const nx=px/W*2-1,ny=1-py/H*2;const e=camEye();const f=norm3(sub3([cam.tx,0,cam.tz],e));const r=norm3(cross3(f,[0,1,0])),up=cross3(r,f);
  const th=Math.tan(FOV/2),asp=W/H;const d=norm3([f[0]+r[0]*nx*th*asp+up[0]*ny*th,f[1]+r[1]*nx*th*asp+up[1]*ny*th,f[2]+r[2]*nx*th*asp+up[2]*ny*th]);

const ICON={};
function renderIcons(){const S=112;const buf=new Uint8Array(S*S*4);const c2=document.createElement('canvas');c2.width=c2.height=S;const ctx=c2.getContext('2d');const id=ctx.createImageData(S,S);
  gl.viewport(0,0,S,S);gl.uniform2f(L.uFogR,500,600);gl.disable(gl.BLEND);
  for(const t of PAL){const IW=t==='wall'||t==='palisade';let me=IW?null:MS.b[0][t];let pts;
    if(IW){const pk=t==='wall'?['post','link']:['ppost','plink'];const m=bMesh(pk[0],0);const l=bMesh(pk[1],0);for(let i=0;i<l.p.length;i+=3){m.p.push(l.p[i]-1,l.p[i+1],l.p[i+2]);m.n.push(l.n[i],l.n[i+1],l.n[i+2]);m.c.push(l.c[i],l.c[i+1],l.c[i+2]);}
      const m2=bMesh(pk[0],0);for(let i=0;i<m2.p.length;i+=3){m.p.push(m2.p[i]-1,m2.p[i+1],m2.p[i+2]);m.n.push(m2.n[i],m2.n[i+1],m2.n[i+2]);m.c.push(m2.c[i],m2.c[i+1],m2.c[i+2]);}me=makeMesh(m);}
    pts=me.pts;let mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9];for(let i=0;i<pts.length;i+=3)for(let a=0;a<3;a++){mn[a]=Math.min(mn[a],pts[i+a]);mx[a]=Math.max(mx[a],pts[i+a]);}
    const ctr=[(mn[0]+mx[0])/2,(mn[1]+mx[1])/2,(mn[2]+mx[2])/2],rad=Math.hypot(mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2])/2;
    const D=rad/Math.sin(.36)*1.02,p=.6;const e=[ctr[0]-FWD[0]*D*Math.cos(p),ctr[1]+D*Math.sin(p),ctr[2]-FWD[2]*D*Math.cos(p)];
    gl.uniformMatrix4fv(L.uVP,false,mul4(persp(.72,1,.1,100),lookAt(e,ctr)));
    gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);lastMesh=null;

function status(b){const T=teams[b.team];
  if(!b.built){const parts=RES.filter(r=>b.need[r]>0).map(r=>`${Math.floor(b.have[r])}/${b.need[r]} ${RESNAME[r]}`).join(' · ');
    const bk=BUILDER[b.type],by=bk&&bk!=='any'?` · raised by ${U[bk].n.toLowerCase()}s`:'';
    return b.prog>0?`Under construction · ${Math.round(b.prog*100)}%${by}`:eth(b)?`Planned · waiting for supplies · ${parts}${by}`:`Waiting for supplies · ${parts}${by}`;}
  const wk=WORK[b.type];const wn=(k)=>`${U[WORK[b.type].k].n}s ${b.workers.length}/${WORK[b.type].n}`;

  case 'barracks':case 'workshop':{const k=b.node.prod,tp=TROOP[k],g=NEED[k];const need=Object.keys(tp.c).filter(r=>T.stock[r]<tp.c[r]).map(r=>RESNAME[r]).join(', ');

  else if(a==='place'){if(ghost&&canPlace(buildType,ghost[0],ghost[1])){if(buildType==='gate'){const o=occ[ghost[1]*N+ghost[0]];if(o){const w=bmap.get(o);if(w){for(const r in B.wall.cost)T.stock[r]+=Math.floor(B.wall.cost[r]/2);destroyB(w,true);}}}placeB(0,buildType,ghost[0],ghost[1],false);toast(B[buildType].n+' planned','plan',0);{const bk=BUILDER[buildType];if(bk&&bk!=='any'&&!units.some(x=>!x.dead&&x.team===0&&x.kind===bk))toast('No '+U[bk].n.toLowerCase()+'s yet. Build a '+B[HOMEOF[bk]].n+'.','nobld'+bk,12,'warn');}ghost=null;refreshCtx(true);}}
  else if(a==='clearmarks'){mark.fill(0);}
  else if(a==='raze'&&rmTarget){const t=rmTarget;if(t.built){for(const r in B[t.type].cost)T.stock[r]+=Math.floor(B[t.type].cost[r]/2);}else{for(const r of RES)T.stock[r]+=t.have[r];}
    destroyB(t,true);rmTarget=null;refreshCtx(true);}
  else if(a==='march'&&sel){const o=sel.off;if(o&&!o.dead&&o.st==='cwait'&&o.fol.length>0)sendCmd(o);}
  else if(a==='up'&&sel&&sel.node){const o=sel.node.opts[+b.dataset.i];if(o&&afford(T,o.cost)){pay(T,o.cost);upgradeB(sel,o);toast(B[sel.type].n+' now trains '+pl(U[o.prod].n).toLowerCase(),'up',0,'good');refreshCtx(true);}}
});
function updHUD(){const T=teams[0];$('#rw').textContent=Math.floor(T.stock.w);$('#rs').textContent=Math.floor(T.stock.s);$('#rf').textContent=Math.floor(T.stock.f);$('#ri').textContent=Math.floor(T.stock.i);
  const kp=teams[0].keep,ke=teams[1].keep;$('#kbP u').style.width=(kp&&!kp.dead?kp.hp/kp.maxHp*100:0)+'%';$('#kbE u').style.width=(ke&&!ke.dead?ke.hp/ke.maxHp*100:0)+'%';
  document.querySelectorAll('.bb').forEach(e=>e.classList.toggle('poor',!afford(T,B[e.dataset.b].cost)));
  refreshCtx();}
$('#kbP').onclick=()=>{if(teams&&teams[0].keep)focus(teams[0].keep)};
$('#kbE').onclick=()=>{if(teams&&teams[1].keep)focus(teams[1].keep)};
$('#bSpd').onclick=()=>{speed=speed===1?2:speed===2?3:1;$('#bSpd').textContent=speed+'×';};
$('#bFx').onclick=()=>{fxOn=!fxOn;$('#bFx').setAttribute('aria-pressed',String(fxOn));};
$('#bPause').onclick=()=>{paused=!paused;$('#bPause').textContent=paused?'▶':'❚❚';$('#bPause').setAttribute('aria-label',paused?'Resume':'Pause');};

/* ================= input ================= */
const ptrs=new Map();let gest=null;
function tileFromScreen(x,y){const p=pick(x,y);if(!p)return null;const i=Math.floor(p[0]),j=Math.floor(p[1]);return inb(i,j)?[i,j,p[0],p[1]]:null;}
function panBy(x0,y0,x1,y1){const a=pick(x0,y0),b=pick(x1,y1);if(!a||!b)return;cam.tx+=a[0]-b[0];cam.tz+=a[1]-b[1];clampCam();}
function paintMode(){return mode==='mark'||(mode==='build'&&!!PAINT[buildType]);}
function paintAt(x,y){const t=tileFromScreen(x,y);if(!t)return;const[i,j]=t;
  const pts=[];if(gest.last){let[x0,y0]=gest.last;const dx=Math.abs(i-x0),dy=Math.abs(j-y0),sx=x0<i?1:-1,sy=y0<j?1:-1;let err=dx-dy;
    for(let n=0;n<200;n++){pts.push([x0,y0]);if(x0===i&&y0===j)break;const e2=2*err;if(e2>-dy){err-=dy;x0+=sx;}if(e2<dx){err+=dx;y0+=sy;}}}else pts.push([i,j]);
  gest.last=[i,j];
  for(const[a,b]of pts){const k=b*N+a;
    if(mode==='mark'){if(!res[k])continue;if(gest.set==null)gest.set=mark[k]?0:1;mark[k]=gest.set;}
    else if(buildType==='field'){if(canField(a,b)){if(teams[0].stock.w>=2){teams[0].stock.w-=2;setField(a,b,0);}else toast('Fields cost 2 wood each','nofw',4,'warn');}}
    else if(canPlace(buildType,a,b))placeB(0,buildType,a,b,false);}}
function tap(x,y){const t=tileFromScreen(x,y);
  if(mode==='build'&&!PAINT[buildType]){if(!t)return;const s=B[buildType].s;ghost=[clamp(Math.floor(t[2]-s/2+.5),0,N-s),clamp(Math.floor(t[3]-s/2+.5),0,N-s)];refreshCtx(true);return;}
  if(paintMode())return;
  const b=t&&occ[t[1]*N+t[0]]?bmap.get(occ[t[1]*N+t[0]]):null;
  if(mode==='remove'){if(t&&fld[t[1]*N+t[0]]&&fldOw[t[1]*N+t[0]]===1&&!b){const k=t[1]*N+t[0];fld[k]=0;fldOw[k]=0;teams[0].stock.w+=1;return;}
    rmTarget=b&&b.team===0&&b.type!=='keep'?b:null;refreshCtx(true);return;}
  select(b||null);}
cv.addEventListener('pointerdown',e=>{if(!running)return;cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){gest={type:'one',sx:e.clientX,sy:e.clientY,moved:false,btn:e.button,last:null,set:null,ghostDrag:false};
    if(mode==='build'&&ghost&&!PAINT[buildType]){const t=tileFromScreen(e.clientX,e.clientY),s=B[buildType].s;if(t&&t[0]>=ghost[0]-1&&t[0]<ghost[0]+s+1&&t[1]>=ghost[1]-1&&t[1]<ghost[1]+s+1)gest.ghostDrag=true;}
    if(paintMode()&&e.button===0)paintAt(e.clientX,e.clientY);}
  else{const p=[...ptrs.values()];gest={type:'two',mid:[(p[0].x+p[1].x)/2,(p[0].y+p[1].y)/2],dist:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)};}});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p||!gest)return;const px=p.x,py=p.y;p.x=e.clientX;p.y=e.clientY;
  if(gest.type==='two'){if(ptrs.size<2)return;const q=[...ptrs.values()];const mid=[(q[0].x+q[1].x)/2,(q[0].y+q[1].y)/2],dist=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y);
    panBy(gest.mid[0],gest.mid[1],mid[0],mid[1]);if(gest.dist>10&&dist>10){cam.D*=gest.dist/dist;clampCam();}gest.mid=mid;gest.dist=dist;return;}
  if(!gest.moved&&Math.hypot(e.clientX-gest.sx,e.clientY-gest.sy)>7)gest.moved=true;
  if(!gest.moved)return;
  if(gest.ghostDrag){const t=tileFromScreen(e.clientX,e.clientY);if(t){const s=B[buildType].s;const g=[clamp(Math.floor(t[2]-s/2+.5),0,N-s),clamp(Math.floor(t[3]-s/2+.5),0,N-s)];if(g[0]!==ghost[0]||g[1]!==ghost[1]){ghost=g;refreshCtx(true);}}return;}
  if(paintMode()&&gest.btn===0)paintAt(e.clientX,e.clientY);else panBy(px,py,e.clientX,e.clientY);});
function endPtr(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(gest&&gest.type==='one'&&!gest.moved&&ptrs.size===0)tap(e.clientX,e.clientY);
  if(ptrs.size===0)gest=null;}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);if(!ptrs.size)gest=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();cam.D*=Math.exp(e.deltaY*.0012);clampCam();},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ================= game flow ================= */
function newGame(){mapSeed=(Math.random()*1e9)|0;blds=[];bmap=new Map();units=[];arrows=[];fx=[];bid=1;uid=1;gameT=0;over=false;
  teams=[{ai:false,stock:{w:80,s:40,f:50,i:12},keep:null,wave:5,marchNow:false},{ai:true,stock:{w:80,s:40,f:50,i:12},keep:null,wave:3,marchNow:false,aiT:6,plan:0,trick:0}];
  genMap(mapSeed);
  const near=(team,type,i,j)=>{for(let r=0;r<9;r++)for(let dj=-r;dj<=r;dj++)for(let di=-r;di<=r;di++){if(Math.max(Math.abs(di),Math.abs(dj))!==r)continue;if(canPlace(type,i+di,j+dj,true))return placeB(team,type,i+di,j+dj,true);}return placeB(team,type,i,j,true);};
  placeB(0,'keep',P_KEEP[0],P_KEEP[1],true);near(0,'hut',P_HUT[0],P_HUT[1]);near(0,'lodge',P_HUT[0],P_HUT[1]-3);
  placeB(1,'keep',N-P_KEEP[0]-3,N-P_KEEP[1]-3,true);near(1,'hut',N-P_HUT[0]-2,N-P_HUT[1]-2);near(1,'lodge',N-P_HUT[0]-2,N-(P_HUT[1]-3)-2);
  buildTerrain();focus(teams[0].keep);cam.tx+=2.5;cam.tz-=2.5;cam.D=innerWidth<innerHeight?23:17;sel=null;setMode('look');}
function endGame(r){if(over)return;over=true;running=false;
  const mins=Math.floor(gameT/60),secs=String(Math.floor(gameT%60)).padStart(2,'0');
  showCard(r==='win'?'Victory':'Defeat',r==='win'?`The red keep burns after ${mins}:${secs}.`:`Your keep fell after ${mins}:${secs}.`,
    `<ul><li><i style="background:var(--gold)"></i><span>Every rule here is a knob. Tell Claude which behaviour felt off and it can be tuned.</span></li></ul>`,'New map');}
function showCard(h,sub,body,btn){$('#card').innerHTML=`<h1>${h}</h1><p class="sub">${sub}</p>${body}<button class="btn pri" id="go">${btn}</button>`;$('#ov').hidden=false;$('#ctx').hidden=true;
  $('#go').onclick=()=>{$('#ov').hidden=true;newGame();running=true;paused=false;$('#bPause').textContent='❚❚';refreshCtx(true);};}
function titleCard(){showCard('Keepwright','Plan the town. The town runs itself.',
  `<ul>
  <li><i style="background:var(--gold)"></i><span><b>Carpenters</b> raise wooden buildings and <b>masons</b> raise stone ones, hauling supplies from your keep. <b>Engineers</b> build traps and ballistae.</span></li>
  <li><i style="background:var(--wood)"></i><span><b>Mills, quarries and mines</b> send workers to the nearest trees, stone and ore, or to the ones you <b>Mark</b>.</span></li>
  <li><i style="background:var(--food)"></i><span><b>Farmers</b> plant and harvest <b>fields</b>. <b>Fletchers</b> stock towers and arm archers, <b>blacksmiths</b> arm the barracks, and <b>engineers</b> supply crossbow and siege parts.</span></li>
  <li><i style="background:var(--red)"></i><span>Soldiers march the moment they are trained, unless an <b>officer</b> is waiting in the hall's courtyard to gather a band. Upgrade the hall for bigger or specialist bands, or <b>generals</b>. Burn the red keep.</span></li>
  </ul><div class="ctl">Drag to look around, pinch to zoom. While marking or drawing walls, move the view with two fingers.</div>`,'Found the town');}

/* ================= main loop ================= */
let last=performance.now(),acc=0,hudT=0;const STEP=1/30;
function frame(ts){const dt=Math.min(.1,(ts-last)/1000);last=ts;
  if(running&&!paused){acc+=dt*speed;let n=0;while(acc>=STEP&&n<12){tick(STEP);acc-=STEP;n++;}if(n>=12)acc=0;}
  if(terrDirty){terrT-=dt;if(terrT<=0){buildTerrain();terrT=.25;}}
  hudT-=dt;if(hudT<=0&&teams){hudT=.25;updHUD();}
  render();requestAnimationFrame(frame);}

resize();initMeshes();renderIcons();buildPalette();
newGame();titleCard();
requestAnimationFrame(frame);
</script>
