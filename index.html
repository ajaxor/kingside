<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kingside">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#b7d1dd">
<meta name="description" content="Kingside: plan the town, let it run itself, burn the red keep.">
<title>Kingside</title>
<!-- Shell: stays tiny and stable. It loads src/launcher.js with a fresh cache-busting tag on every visit, so the launcher, the modules and
     the stylesheet it pulls in are never a stale copy. The page markup, the title screen, the styles and the loading logic all live in
     src/ and style.css (src/ui/dom.js, src/ui/title-screen.js, src/launcher.js), not here. -->
<style>
html,body{height:100%;margin:0;background:#b7d1dd}
body.loading>:not(#boot){visibility:hidden}
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#141a20;font:500 14px system-ui,-apple-system,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
#boot button{font:600 16px system-ui,-apple-system,sans-serif;color:#241a08;background:#e8b64c;border:0;border-radius:99px;padding:12px 28px}
</style></head><body class="loading">
<div id="boot"><div id="boot-msg">Loading...</div></div>

<script>
(async()=>{
  try{
    const m=await import(new URL('src/launcher.js?v='+Date.now(),location.href).href);
    await m.launch({tag:String(Date.now())});
  }catch(e){
    console.error(e);
    document.body.classList.remove('loading');
    document.getElementById('boot-msg').textContent='Could not load the game: '+String(e.message||e).split('\n')[0].slice(0,120);
    const b=document.createElement('button');b.textContent='Retry';b.onclick=()=>location.reload();document.getElementById('boot').append(b);
  }
})();
</script></body></html>
